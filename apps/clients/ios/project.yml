# The Xcode project of the iOS app, generated by `./gradlew iosGenerateProject` (XcodeGen).
# The generated Notes.xcodeproj is not committed: change this file, then generate again.
name: Notes
options:
  bundleIdPrefix: dev.ylp
  deploymentTarget:
    # Swift export's coroutine bridge needs iOS 18 (ADR 0027).
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Where the app finds the API and the identity provider. Gradle passes the values of
    # mobileApiBaseUrl, mobileOidcIssuer and mobileOidcClientId; these target the local stack.
    NOTES_API_BASE_URL: http://localhost:8088/api/v1
    NOTES_OIDC_ISSUER: http://localhost:8090/default
    NOTES_OIDC_CLIENT_ID: api-mobile
targets:
  Notes:
    type: application
    platform: iOS
    sources:
      - Notes
    info:
      path: Notes/Info.plist
      properties:
        CFBundleDisplayName: Notes
        UILaunchScreen: {}
        NotesApiBaseUrl: $(NOTES_API_BASE_URL)
        NotesOidcIssuer: $(NOTES_OIDC_ISSUER)
        NotesOidcClientId: $(NOTES_OIDC_CLIENT_ID)
        # Plain HTTP to the local stack only; any other address needs HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ylp.notes
        # The script below runs Gradle, which reads and writes outside the sandbox Xcode allows.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Build the shared module
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../../.."
          ./gradlew :apps:clients:shared:embedSwiftExportForXcode
  NotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NotesTests
      - TestSupport
    dependencies:
      - target: Notes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: dev.ylp.notes.tests
        # XCTestCase is not main-actor isolated: each test class says where it runs.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  NotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NotesUITests
      - TestSupport
    dependencies:
      - target: Notes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: dev.ylp.notes.uitests
        # XCTestCase is not main-actor isolated: each test class says where it runs.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: Notes
schemes:
  Notes:
    build:
      targets:
        Notes: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Notes
      targets:
        - NotesTests
        - NotesUITests

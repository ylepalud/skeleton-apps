info:
  name: Replace the title and content of one of the caller's notes
  type: http
  seq: 4
  tags:
    - notes

http:
  method: PUT
  url: "{{baseUrl}}/notes/:noteId"
  headers:
    - name: If-Match
      value: '"0"'
      description: The ETag of the version the change is based on, as last read. A resource changed since answers 412; `*` matches any version.
  params:
    - name: noteId
      value: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c
      type: path
      description: Id of the note.
  body:
    type: json
    data: |-
      {
        "title": "Groceries for the weekend",
        "content": "Milk, eggs, bread, coffee"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true


info:
  name: Write a new note
  type: http
  seq: 2
  tags:
    - notes

http:
  method: POST
  url: "{{baseUrl}}/notes"
  body:
    type: json
    data: |-
      {
        "title": "Groceries",
        "content": "Milk, eggs, bread"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: The note was created.
    request:
      url: "{{baseUrl}}/notes"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "Groceries",
            "content": "Milk, eggs, bread"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c",
            "title": "Groceries",
            "content": "Milk, eggs, bread",
            "createdAt": "2026-10-22T08:00:00Z",
            "updatedAt": "2026-10-22T09:30:00Z",
            "version": 0
          }
  - name: 400 Response
    description: The request is malformed or violates a constraint.
    request:
      url: "{{baseUrl}}/notes"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "Groceries",
            "content": "Milk, eggs, bread"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "urn:problem:note_not_found",
            "title": "Not Found",
            "status": 404,
            "detail": "Note not found: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c",
            "instance": "/api/v1/notes/3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c",
            "errorCode": "NOTE_NOT_FOUND",
            "hint": "Check the note id: it does not exist, or it belongs to another user."
          }
  - name: 401 Response
    description: The bearer token is missing, invalid or expired.
    request:
      url: "{{baseUrl}}/notes"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "Groceries",
            "content": "Milk, eggs, bread"
          }
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 413 Response
    description: The request body exceeds the accepted size.
    request:
      url: "{{baseUrl}}/notes"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "Groceries",
            "content": "Milk, eggs, bread"
          }
    response:
      status: 413
      statusText: Payload Too Large
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "urn:problem:note_not_found",
            "title": "Not Found",
            "status": 404,
            "detail": "Note not found: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c",
            "instance": "/api/v1/notes/3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c",
            "errorCode": "NOTE_NOT_FOUND",
            "hint": "Check the note id: it does not exist, or it belongs to another user."
          }
  - name: 500 Response
    description: An unexpected error occurred.
    request:
      url: "{{baseUrl}}/notes"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "Groceries",
            "content": "Milk, eggs, bread"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "urn:problem:note_not_found",
            "title": "Not Found",
            "status": 404,
            "detail": "Note not found: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c",
            "instance": "/api/v1/notes/3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c",
            "errorCode": "NOTE_NOT_FOUND",
            "hint": "Check the note id: it does not exist, or it belongs to another user."
          }

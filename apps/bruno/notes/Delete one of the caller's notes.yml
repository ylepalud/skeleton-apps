info:
  name: Delete one of the caller's notes
  type: http
  seq: 5
  tags:
    - notes

http:
  method: DELETE
  url: "{{baseUrl}}/notes/:noteId"
  params:
    - name: noteId
      value: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c
      type: path
      description: Id of the note.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: The note was deleted.
    request:
      url: "{{baseUrl}}/notes/:noteId"
      method: DELETE
      params:
        - name: noteId
          value: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c
          type: path
          description: Id of the note.
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    request:
      url: "{{baseUrl}}/notes/:noteId"
      method: DELETE
      params:
        - name: noteId
          value: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c
          type: path
          description: Id of the note.
    response:
      status: 401
      statusText: Unauthorized
      body:
        type: text
        data: ""
  - name: 404 Response
    request:
      url: "{{baseUrl}}/notes/:noteId"
      method: DELETE
      params:
        - name: noteId
          value: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c
          type: path
          description: Id of the note.
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: ""
  - name: 500 Response
    request:
      url: "{{baseUrl}}/notes/:noteId"
      method: DELETE
      params:
        - name: noteId
          value: 3f0c1e6a-8b2d-4f7e-9a1c-5d6e7f8a9b0c
          type: path
          description: Id of the note.
    response:

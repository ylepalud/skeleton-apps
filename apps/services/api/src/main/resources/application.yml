spring:
  application:
    name: api
  # The datasource comes from SPRING_DATASOURCE_* in the cluster, from Docker Compose
  # under the local profile, and from Testcontainers in tests.
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Liquibase; Hibernate only checks that the mapping matches it.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: true
  web:
    # Error messages are part of the API: the same language whatever the caller or the host.
    locale: en
    locale-resolver: fixed
  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer comes from SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI in the
          # cluster; tokens must also be addressed to this API.
          audiences: api

# Actuator lives on its own port, reachable inside the cluster only.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true

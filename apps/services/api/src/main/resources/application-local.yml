spring:
  docker:
    compose:
      # The repository's compose file, relative to bootRun's working directory. Without the
      # "app" profile it starts only postgres and the identity provider.
      file: ../../../compose.yaml
      # Keep them running between application restarts.
      lifecycle-management: start-only
  security:
    oauth2:
      resourceserver:
        jwt:
          # mock-oauth2-server from compose.yaml.
          issuer-uri: http://localhost:8090/default

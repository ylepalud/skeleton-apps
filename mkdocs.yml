# Documentation site, built by Zensical (./gradlew docsBuild) from docs/ and
# published to GitHub Pages by .github/workflows/docs.yml. Keep it to what
# Zensical reads: no MkDocs plugin, no hook.
site_name: skeleton-apps
# The Pages workflow sets the published address; locally, the preview's.
site_url: !ENV [SITE_URL, "http://localhost:8000/"]
repo_url: https://github.com/ylepalud/skeleton-apps
edit_uri: edit/develop/docs/
site_dir: build/docs/site

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  # Includes the root CHANGELOG.md, which a generated project has only after
  # its first release: a missing file renders an empty page.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# With --strict, a broken link or anchor fails the build.
validation:
  links:
    anchors: warn

nav:
  - Home: README.md
  - Product:
      - product/README.md
      - product/use-the-web-app.md  # client:web
      - product/use-the-android-app.md  # client:mobile
      - product/use-the-ios-app.md  # client:mobile
      - product/use-the-cli.md  # client:cli
      - product/api-errors.md
      # Generated by docsApiReference from apps/contracts/api/openapi.yaml.
      - API reference: product/api-reference.html
  - Template:
      - template/README.md
      - template/start-a-new-project.md
      - template/mark-a-clients-passage.md
  - Contributor:
      - contributor/README.md
      - Tutorials:
          - contributor/tutorials/first-feature.md
      - How-to guides:
          - contributor/how-to/run-locally.md
          - contributor/how-to/run-the-android-app.md  # client:mobile
          - contributor/how-to/run-the-ios-app.md  # client:mobile
          - contributor/how-to/run-the-cli.md  # client:cli
          - contributor/how-to/change-the-api-contract.md
          - contributor/how-to/add-a-module.md
          - contributor/how-to/switch-identity-provider.md
          - contributor/how-to/track-an-epic.md
      - Reference:
          - contributor/reference/commands.md
          - contributor/reference/agent-cli.md
          - contributor/reference/repository-layout.md
          - contributor/reference/gradle-conventions.md
          - contributor/reference/configuration.md
          - contributor/reference/local-stack.md
  - Acceptance:
      - acceptance/README.md
  - Operations:
      - operations/README.md
      - operations/ci-cd.md
      - operations/release.md
      - operations/update-dependencies.md
      - operations/read-a-failing-ci.md
      - operations/troubleshoot.md
  - Architecture:
      - architecture/README.md
      - architecture/overview.md
      # Generated by docsDomainModel from the module model.
      - architecture/domain-model.md
      - architecture/contract-first.md
      - architecture/clients.md  # client:native
      - architecture/security.md
      - architecture/testing-strategy.md
      - architecture/supply-chain.md
      - architecture/decisions.md
  - Changelog: changelog.md

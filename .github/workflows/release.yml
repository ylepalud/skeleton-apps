# Releases come from main. release-please keeps a release pull request up to date
# from the Conventional Commits; merging it tags vX.Y.Z. The images built from the
# released code then get that tag too: the release promotes the exact images that
# were tested and signed on develop, it never rebuilds them.
name: Release

on:
  push:
    branches: [main]
  # Promotes the images of an existing release again, e.g. after a failed promotion.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the workflow's own token, the release pull request starts no workflow: no
      # check runs and the main ruleset blocks it. A GitHub App token does start them.
      # Without the App (a freshly generated project), the workflow token still works,
      # and the release pull request is merged with the admin bypass.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          # Releases live on main; without this, the action targets the default branch, develop.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote-images:
    needs: release-please
    if: >-
      always() && (needs.release-please.outputs.created == 'true'
      || (github.event_name == 'workflow_dispatch' && needs.release-please.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      REPOSITORY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tag the newest published image of each component
        run: |
          # The release commit sits on main above the merge of develop: walk back to the
          # newest commit that has a published image, and give that image the release tag.
          for image in api api-app; do
            found=""
            for sha in $(git rev-list --max-count=50 "$TAG"); do
              if docker buildx imagetools inspect "$REPOSITORY/$image:$sha" > /dev/null 2>&1; then
                docker buildx imagetools create --tag "$REPOSITORY/$image:$TAG" "$REPOSITORY/$image:$sha"
                echo "$image:$sha -> $image:$TAG"
                found="yes"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::No published $image image in the last 50 commits of $TAG"
              exit 1
            fi
          done

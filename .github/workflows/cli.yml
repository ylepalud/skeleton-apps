# The command-line client on Linux and macOS: the shared module's common tests
# and the CLI's own on each platform, its JVM tests and coverage gate, then the
# release binary as an artifact. Called by ci.yml when a pull request can affect
# the CLI. The binaries link against the system's SQLite, which both runners have.
name: CLI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cli:
    name: cli (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            runner: ubuntu-26.04
            artifact: notes-linux-x64
          - target: macosArm64
            runner: macos-26
            artifact: notes-macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The Kotlin/Native compiler and its dependencies, downloaded once per
      # Kotlin version, and kept even when the job fails.
      - name: Restore Kotlin/Native
        id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Tests on ${{ matrix.target }}, JVM tests and coverage, then the release binary
        run: >-
          ./gradlew
          :apps:clients:shared:${{ matrix.target }}Test
          :apps:clients:cli:check
          :apps:clients:cli:linkReleaseExecutable${{ matrix.target == 'linuxX64' && 'LinuxX64' || 'MacosArm64' }}
      - name: Keep Kotlin/Native
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Name the binary
        run: cp apps/clients/cli/build/bin/${{ matrix.target }}/releaseExecutable/notes.kexe notes
      - name: Keep the binary (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: notes
          retention-days: 7
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-reports-${{ matrix.target }}
          path: |
            apps/clients/cli/build/reports/
            apps/clients/cli/build/test-results/
            apps/clients/shared/build/reports/
            apps/clients/shared/build/test-results/
          retention-days: 7

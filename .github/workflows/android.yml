# The Android app on a Linux runner: lint, the Robolectric UI tests and the
# coverage gate, then the debug APK as an artifact. Called by ci.yml when a
# pull request can affect the app.
name: Android

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    name: android
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Lint, Robolectric tests, coverage, and the debug build
        run: ./gradlew :apps:clients:android:check :apps:clients:android:assembleDebug
      - name: Keep the debug APK (unsigned for distribution)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: apps/clients/android/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/clients/android/build/reports/
            apps/clients/android/build/test-results/
          retention-days: 7

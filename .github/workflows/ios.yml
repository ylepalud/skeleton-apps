# The iOS app on a macOS runner: its swift-format lint, its unit and UI tests on
# the simulator and its coverage, then the simulator build as an artifact.
# Called by ci.yml when a pull request can affect the app, and by nightly.yml,
# which also runs the shared module's common tests on the simulator.
name: iOS

on:
  workflow_call:
    inputs:
      shared-tests:
        description: Also run the shared module's tests on the simulator.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios:
    name: ios
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIMULATOR: iPhone 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The simulator of that name on the newest installed runtime, by UDID: by
      # name, xcodebuild wants the SDK's own version, which may not be installed.
      # It boots in the background while Gradle starts; the tests wait for it.
      - name: Boot the simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r --arg name "$SIMULATOR" '
            .devices | to_entries | map(select(.key | test("iOS")))
            | sort_by(.key | capture("iOS-(?<v>.*)").v | split("-") | map(tonumber))
            | map(.value[] | select(.name == $name)) | last | .udid')
          echo "Simulator: $SIMULATOR ($udid)"
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The Kotlin/Native compiler and its dependencies: about 1 GB, downloaded
      # once per Kotlin version, and kept even when the job fails.
      - name: Restore Kotlin/Native
        id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - run: brew install xcodegen
      - name: Shared module on the simulator
        if: inputs.shared-tests
        run: ./gradlew :apps:clients:shared:iosSimulatorArm64Test
      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Lint, tests and coverage of the app
        run: ./gradlew iosLint iosVerifyCoverage -PiosSimulator="$SIMULATOR_ID"
      - name: Keep Kotlin/Native
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Package the simulator build
        run: ditto -c -k --keepParent apps/clients/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Notes.app Notes-simulator.zip
      - name: Keep the simulator build (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: Notes-simulator.zip
          retention-days: 7
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: |
            build/ios/Test.xcresult
            apps/clients/shared/build/reports/
          retention-days: 7

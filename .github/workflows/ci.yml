# Every pull request, and every change reaching main, passes the whole check:
# build, tests (including Testcontainers and the convention plugins' TestKit),
# coverage, static analysis, the web app, the Bruno collection, end-to-end tests
# against the full stack, and a dependency and configuration scan.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
      - run: ./gradlew check
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
      - name: Start the stack (images built from this commit)
        run: ./gradlew startLocalStack :bruno:npmInstall
      - name: Install the browser
        working-directory: services/api-app
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8088
        run: ./gradlew :services:api-app:npmRunE2e -PrunE2e=true
      - name: Replay the API collection
        working-directory: bruno
        run: npm run smoke
      - name: Show the stack logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            services/api-app/playwright-report/
            services/api-app/test-results/
          retention-days: 7

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          # Build tooling runs in CI with a token: its vulnerabilities count too.
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
          # Otherwise the SARIF report, and the exit code, cover every severity.
          limit-severities-for-sarif: "true"
      - name: Publish the findings to the Security tab
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

# Every pull request, and every change reaching main, passes the whole check:
# build, tests (including Testcontainers and the convention plugins' TestKit),
# coverage, static analysis, the clients, the Bruno collection, end-to-end tests
# against the full stack, a scan of the images that stack runs, a dependency
# and configuration scan, and the documentation: Markdown lint and a strict
# build of the site. The native clients have their own workflows, run only when
# a change can affect them.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # client:native:start
      # The shared module compiles for Linux: Kotlin/Native is restored, and
      # kept when this job downloads it.
      - name: Restore Kotlin/Native
        id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      # client:native:end
      # The native clients, and the shared module's Linux tests, are checked by
      # their own jobs.
      - run: |
          excluded=()
          # client:mobile:start
          excluded+=(-x :apps:clients:android:check)
          # client:mobile:end
          # client:cli:start
          excluded+=(-x :apps:clients:cli:check -x :apps:clients:shared:linuxX64Test)
          # client:cli:end
          ./gradlew check "${excluded[@]}"
      # client:native:start
      - name: Keep Kotlin/Native
        if: always() && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      # client:native:end
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # client:native:start
  # Which client apps a change can affect; the others are skipped, and the
  # mobile job below reports for all of them.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      # client:mobile:start
      android: ${{ steps.diff.outputs.android }}
      ios: ${{ steps.diff.outputs.ios }}
      # client:mobile:end
      # client:cli:start
      cli: ${{ steps.diff.outputs.cli }}
      # client:cli:end
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Every client: the client library, the contract it is generated from
          # and this workflow.
          shared='^(apps/clients/shared/|apps/contracts/api/|\.github/workflows/ci\.yml$)'
          # client:mobile:start
          # Android also follows the whole build: its job is short. The iOS job
          # takes a macOS runner for a quarter of an hour: it follows only the
          # conventions it builds with, and the nightly run covers the rest, such
          # as a dependency upgrade.
          build='^(build-logic/|gradle/|[^/]*\.gradle\.kts$|gradle\.properties$|\.github/workflows/android\.yml$)'
          ios_build='^(build-logic/src/main/kotlin/(xcode-app|kotlin-multiplatform-convention|openapi-kotlin-client)\.gradle\.kts$|\.github/workflows/ios\.yml$)'
          # client:mobile:end
          # client:cli:start
          # The CLI follows the conventions it builds with and the version catalog.
          cli_build='^(build-logic/src/main/kotlin/(kotlin-native-cli-convention|kotlin-multiplatform-convention|openapi-kotlin-client)\.gradle\.kts$|gradle/libs\.versions\.toml$|\.github/workflows/cli\.yml$)'
          # client:cli:end
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # No base to compare with, such as a new branch: check everything,
            # one path per line as git diff lists them.
            files=''
            # client:mobile:start
            files+=$'apps/clients/android/\napps/clients/ios/\n'
            # client:mobile:end
            # client:cli:start
            files+=$'apps/clients/cli/\n'
            # client:cli:end
          else
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          affects() { grep -Eq "$shared|$1" <<<"$files" && echo true || echo false; }
          # client:mobile:start
          echo "android=$(affects "^apps/clients/android/|$build")" >> "$GITHUB_OUTPUT"
          echo "ios=$(affects "^apps/clients/ios/|$ios_build")" >> "$GITHUB_OUTPUT"
          # client:mobile:end
          # client:cli:start
          echo "cli=$(affects "^apps/clients/cli/|$cli_build")" >> "$GITHUB_OUTPUT"
          # client:cli:end
          cat "$GITHUB_OUTPUT"

  # client:mobile:start
  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml

  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml
  # client:mobile:end

  # client:cli:start
  cli:
    name: cli
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/cli.yml
  # client:cli:end

  # The required check for the client apps (named before the CLI joined them): a
  # skipped job, or one run through a reusable workflow, reports under a name
  # that changes with what happened. This one always reports, and fails if any
  # client job failed.
  mobile:
    name: mobile
    needs:
      - changes
      # client:mobile:start
      - android
      - ios
      # client:mobile:end
      # client:cli:start
      - cli
      # client:cli:end
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # A failed changes job skips every client job: it must fail this one too.
      - env:
          CHANGES: ${{ needs.changes.result }}
          # client:mobile:start
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          # client:mobile:end
          # client:cli:start
          CLI: ${{ needs.cli.result }}
          # client:cli:end
        run: |
          results=()
          # client:mobile:start
          results+=("android $ANDROID" "ios $IOS")
          # client:mobile:end
          # client:cli:start
          results+=("cli $CLI")
          # client:cli:end
          echo "changes: $CHANGES; ${results[*]}"
          [ "$CHANGES" = success ] || exit 1
          for result in "${results[@]}"; do
            case "${result#* }" in success|skipped) ;; *) exit 1 ;; esac
          done
  # client:native:end

  e2e:
    name: e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Start the stack (images built from this commit)
        id: stack
        run: ./gradlew startLocalStack :apps:bruno:npmInstall
      # client:web:start
      - name: Install the browser
        working-directory: apps/services/api-app
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8088
        run: ./gradlew :apps:services:api-app:npmRunE2e -PrunE2e=true
      # client:web:end
      - name: Replay the API collection
        working-directory: apps/bruno
        run: npm run smoke
      # The images Publish would push, scanned before merge: a base image or OS
      # package with a fixable vulnerability fails here rather than after merge.
      - name: Scan the API image
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: skeleton-apps/api:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # client:web:start
      - name: Scan the web image
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: skeleton-apps/api-app:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      # client:web:end
      - name: Show the stack logs
        if: failure()
        run: docker compose --profile app logs --no-color
      # client:web:start
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/services/api-app/playwright-report/
            apps/services/api-app/test-results/
          retention-days: 7
      # client:web:end

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Build tooling runs in CI with a token: its vulnerabilities count too.
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
          # Otherwise the SARIF report, and the exit code, cover every severity.
          limit-severities-for-sarif: "true"
      - name: Publish the findings to the Security tab
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  docs:
    name: docs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No em dash in the documentation
        run: |
          if grep -rn --include='*.md' $'—' README.md AGENTS.md docs; then
            echo "::error::Em dash found: use a colon, a comma or parentheses instead."
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Lint the Markdown and build the site, failing on a broken link
        run: ./gradlew docsLint docsBuild

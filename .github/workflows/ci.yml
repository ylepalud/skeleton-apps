# Every pull request, and every change reaching main, passes the whole check:
# build, tests (including Testcontainers and the convention plugins' TestKit),
# coverage, static analysis, the web app, the Bruno collection, end-to-end tests
# against the full stack, a scan of the images that stack runs, a dependency
# and configuration scan, and the documentation: Markdown lint and a strict
# build of the site. The Android and iOS apps have their own jobs, which run
# only when a change can affect them.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The Android app is checked by the android job.
      - run: ./gradlew check -x :apps:clients:android:check
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  # Which mobile apps a change can affect. The mobile jobs are required checks:
  # rather than not starting, they are skipped, which counts as passed.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Shared by both apps: the client library, the contract it is generated
          # from, the build and this workflow.
          shared='^(apps/clients/shared/|apps/contracts/api/|build-logic/|gradle/|[^/]*\.gradle\.kts$|gradle\.properties$|\.github/workflows/ci\.yml$)'
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # No base to compare with, such as a new branch: check everything.
            files="apps/clients/android/ apps/clients/ios/"
          else
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          affects() { grep -Eq "$shared|$1" <<<"$files" && echo true || echo false; }
          echo "android=$(affects '^apps/clients/android/')" >> "$GITHUB_OUTPUT"
          echo "ios=$(affects '^apps/clients/ios/')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Lint, Robolectric tests, coverage, and the debug build
        run: ./gradlew :apps:clients:android:check :apps:clients:android:assembleDebug
      - name: Keep the debug APK (unsigned for distribution)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: apps/clients/android/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/clients/android/build/reports/
            apps/clients/android/build/test-results/
          retention-days: 7

  ios:
    name: ios
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIMULATOR: iPhone 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The Kotlin/Native compiler and its dependencies: about 1 GB, downloaded
      # once per Kotlin version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - run: brew install xcodegen
      # A simulator booted for the first time can outlast xcodebuild's wait.
      - name: Boot the simulator
        run: |
          xcrun simctl boot "$SIMULATOR"
          xcrun simctl bootstatus "$SIMULATOR" -b
      - name: Shared module on the simulator, then the app's lint, tests and coverage
        run: >-
          ./gradlew :apps:clients:shared:iosSimulatorArm64Test iosLint iosVerifyCoverage
          -PiosSimulator="$SIMULATOR"
      - name: Package the simulator build
        run: ditto -c -k --keepParent apps/clients/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Notes.app Notes-simulator.zip
      - name: Keep the simulator build (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: Notes-simulator.zip
          retention-days: 7
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: |
            build/ios/Test.xcresult
            apps/clients/shared/build/reports/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Start the stack (images built from this commit)
        id: stack
        run: ./gradlew startLocalStack :apps:bruno:npmInstall
      - name: Install the browser
        working-directory: apps/services/api-app
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8088
        run: ./gradlew :apps:services:api-app:npmRunE2e -PrunE2e=true
      - name: Replay the API collection
        working-directory: apps/bruno
        run: npm run smoke
      # The images Publish would push, scanned before merge: a base image or OS
      # package with a fixable vulnerability fails here rather than after merge.
      - name: Scan the API image
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: skeleton-apps/api:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the web image
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: skeleton-apps/api-app:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Show the stack logs
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/services/api-app/playwright-report/
            apps/services/api-app/test-results/
          retention-days: 7

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan dependencies, secrets and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Build tooling runs in CI with a token: its vulnerabilities count too.
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
          # Otherwise the SARIF report, and the exit code, cover every severity.
          limit-severities-for-sarif: "true"
      - name: Publish the findings to the Security tab
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  docs:
    name: docs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No em dash in the documentation
        run: |
          if grep -rn --include='*.md' $'—' README.md AGENTS.md docs; then
            echo "::error::Em dash found: use a colon, a comma or parentheses instead."
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Lint the Markdown and build the site, failing on a broken link
        run: ./gradlew docsLint docsBuild

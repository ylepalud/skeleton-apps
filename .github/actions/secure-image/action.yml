name: Secure image
description: >-
  Scans a pushed image with Trivy, attaches its SBOM, and signs it with cosign (keyless,
  GitHub OIDC). The image is signed only if the scan passes. Needs id-token: write and
  packages: write, and a registry login beforehand.
inputs:
  image:
    description: Image reference by digest, e.g. ghcr.io/owner/repo/api@sha256:...
    required: true
  name:
    description: Short name of the image, used for artifact names.
    required: true
runs:
  using: composite
  steps:
    - name: Scan the image
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "1"

    - name: Generate the SBOM
      uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
      with:
        image: ${{ inputs.image }}
        format: spdx-json
        output-file: sbom-${{ inputs.name }}.spdx.json
        artifact-name: sbom-${{ inputs.name }}.spdx.json

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign the image and attest its SBOM
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SBOM: sbom-${{ inputs.name }}.spdx.json
      run: |
        cosign sign --yes "$IMAGE"
        cosign attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE"

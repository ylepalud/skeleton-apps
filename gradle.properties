org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Kotlin/Native compiles inside the Gradle daemon and needs more than the default heap and metaspace.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build tool versions. They configure the build itself and never reach an
# application classpath; library and Gradle plugin versions live in
# gradle/libs.versions.toml, and libraries managed by the Spring Boot BOM are
# declared without a version. The "renovate:" comments let Renovate update them.
javaToolchainVersion=25
# renovate: datasource=maven depName=org.jacoco:org.jacoco.core
jacocoVersion=0.8.16
# 1.37.0 fails inside Spotless 8.10.4 (InvocationTargetException); stay on
# 1.36.0 until a Spotless release supports it.
# renovate: datasource=maven depName=com.google.googlejavaformat:google-java-format
googleJavaFormatVersion=1.36.1
# renovate: datasource=maven depName=org.pitest:pitest
pitestVersion=1.30.1
# renovate: datasource=maven depName=org.pitest:pitest-junit5-plugin
pitestJunit5PluginVersion=1.2.3

# Android SDK levels of the native clients. AndroidX libraries set the minimum compileSdk.
androidCompileSdk=37
androidMinSdk=26
androidTargetSdk=37

# Pinned Node.js LTS, downloaded by every frontend build.
# renovate: datasource=node-version depName=node versioning=node
nodeToolchainVersion=24.22.2

# Base image of the JVM application images, pinned by digest.
jibBaseImage=gcr.io/distroless/java25-debian13:nonroot@sha256:5d3177252775d4b01603470fe21c015393019089904f68724bd37242e4bc6e6d

# Documentation tooling, run in containers by the docs* tasks, pinned by digest.
docsSiteImage=zensical/zensical:0.1.0@sha256:a9512943ddf49c645fd3c0861e5347f9c889abe7f5fdaad05e047582b8069b70
docsApiReferenceImage=redocly/cli:2.72.1@sha256:d39a229ebd8250fea62f44c377ddb04797e8a155140eda49db17f1caaa9334ff
docsLintImage=davidanson/markdownlint-cli2:v0.24.0@sha256:70ead7c0352d22d04bbe612cd96b54ec591538d8f4626cafe391bb2ecf3639ca
